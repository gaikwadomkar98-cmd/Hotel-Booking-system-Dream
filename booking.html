<!DOCTYPE html>
<html lang="en">
<head>

  <title>Booking - Hotel Dream</title>
  <link rel="stylesheet" href="styleb.css">
</head>
<body>
  <header>
    <h1>Book Your Stay</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="rooms.html">Rooms</a>
      <a href="booking.html" class="active">Booking</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
<main>
  <section class="booking-form">
    <h2>Reservation Form</h2>

    <form action="booking_su.php" method="POST">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="full_name" required>

      <label for="Adhar_no">Adhar Card No:</label>
      <input type="text" id="Adhar_no" name="Adhar_no" maxlength="12" required>

      <label for="checkin">Check-In Date:</label>
      <input type="date" id="checkin" name="check_in" required>

      <label for="checkout">Check-Out Date:</label>
      <input type="date" id="checkout" name="check_out" required>

      <label for="room-type">Room Type:</label>
      <select id="room-type" name="room_type" required>
        <option value="">Select Room Type</option>
        <option value="Deluxe Room">Deluxe Room</option>
        <option value="Super Deluxe Room">Super Deluxe Room</option>
	<option value="Family Room">Family Room</option>
	<option value="Suite Room">Suite Room</option>
      </select>

      <label for="guests">Number of Guests:</label>
      <input type="number" id="guests" name="guest" min="1" max="5" required>

      <button type="submit" class="btn">Confirm Booking</button>
    </form>
  </section>
</main>


  <footer>
    <p>&copy; Hotel Dream. All Rights Reserved.</p>
  </footer>
</body>
</html>
